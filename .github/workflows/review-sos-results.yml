name: Review public SOS election sources
on:
  push:
    branches: [feature/20261104-results-runoffs]
    paths:
      - scripts/capture_official_results.py
      - .github/workflows/review-sos-results.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public page reader
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Read public aggregate election sources
        run: python scripts/capture_official_results.py
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sos-public-source-review
          path: official-source-review/
          retention-days: 7
          if-no-files-found: error
